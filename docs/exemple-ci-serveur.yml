# Exemple de workflow GitHub Actions pour tester VOTRE serveur/plugin avec Arthur's Bot.
# Copiez-le dans le dépôt de votre plugin (.github/workflows/) et adaptez les étapes
# de démarrage du serveur (Paper, Spigot, Fabric...).
name: Tests en jeu

on: [push, pull_request]

jobs:
  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Démarrer un serveur Paper avec le plugin
        run: |
          mkdir server && cd server
          URL=$(curl -sS https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds/latest | jq -r '.downloads["server:default"].url')
          curl -sSL -o paper.jar "$URL"
          echo "eula=true" > eula.txt
          printf "online-mode=false\nserver-port=25565\n" > server.properties
          mkdir -p plugins && cp ../build/libs/*.jar plugins/
          nohup java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Done" server.log && break; sleep 2; done

      - name: Installer Arthur's Bot
        run: |
          git clone https://github.com/Arthur-91140/Arthur-s-Bot.git bot
          cd bot && npm ci

      - name: Lancer le scénario de test
        run: node bot/bin/arthur-bot.js run tests/mon-scenario.json --host localhost --port 25565 --bots 3 --timeout 120 --junit rapport.xml --report rapport.json

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-bots
          path: |
            rapport.xml
            rapport.json
            server/server.log
